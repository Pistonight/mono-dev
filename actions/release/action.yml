name: mono-dev release
description: Draft a release

inputs:
  artifacts-workflow:
    description: "Workflow name to download artifacts from"
    default: ""
  artifacts-path:
    description: "Path to download artifacts to"
    default: ""
  pack:
    description: >
      Automatically pack downloaded artifacts as .zip or .tar.gz, per artifact. 
      Could be a pattern with * to match beginning or end of the artifact name. 
      false disables packing. ** or true packs everything
    default: true
  append-version:
    description: "Append version tag to packed artifacts"
    default: true
  task:
    description: "Task to run after downloading artifacts but before packing or signing"
    default: ""
  minisign-key:
    description: "Minisign secret key to sign the packed artifacts and pass-through files"
    default: ""
  signing-comment:
    description: "Comment to use when signing the release files"
    default: "Signed by mono-dev release GitHub action"

  files:
    description: >
      Files to upload to the release as-is (not packed), separated by whitespace or newlines.
      Paths are relative to the workspace and can be globs (e.g. dist/*.whl).
      Each entry must match at least one file. Paths with spaces are not supported
    default: ""
  tag:
    description: "Release tag (defaults to github.ref_name)"
    default: "${{ github.ref_name }}"

runs:
  using: composite
  steps:
    - if: ${{ inputs.artifacts-workflow != '' && inputs.artifacts-path != '' }}
      run: mkdir -p ${{ inputs.artifacts-path }}
      shell: bash
    - if: ${{ inputs.artifacts-workflow != '' && inputs.artifacts-path != '' }}
      uses: dawidd6/action-download-artifact@v28
      with:
        workflow: ${{ inputs.artifacts-workflow }}
        ref: ${{ github.ref }}
        path: ${{ inputs.artifacts-path }}

    - if: ${{ inputs.task != '' }}
      run: task exec -- ${{ inputs.task }}
      shell: bash

    - id: pack
      run: node pack.mjs
      working-directory: ${{ github.action_path }}
      env:
        MONODEV_RELEASE_FILES: ${{ inputs.files }}
        MONODEV_RELEASE_HAS_MINISIGN_KEY: ${{ inputs.minisign-key != ''}}
        MONODEV_RELEASE_PACK: ${{ inputs.pack }}
        MONODEV_RELEASE_ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
        MONODEV_RELEASE_WORKSPACE: ${{ github.workspace }}
        MONODEV_RELEASE_APPEND_VERSION: ${{ inputs.append-version }}
        MONODEV_RELEASE_VERSION: ${{ inputs.tag }}
      shell: bash

    - if: ${{ inputs.minisign-key != '' && steps.pack.outputs.release_files != '' }}
      uses: robinraju/release-downloader@v1
      with:
        repository: jedisct1/minisign
        latest: true
        fileName: "*-linux.tar.gz"
        out-file-path: .minisign
        extract: true
    - if: ${{ inputs.minisign-key != '' && steps.pack.outputs.release_files != '' }}
      run: |
        mapfile -t FILES <<< "$RELEASE_FILES"
        printf "%s" "$MINISIGN_KEY" > .minisign/minisign.key
        chmod +x .minisign/minisign-linux/x86_64/minisign
        ./.minisign/minisign-linux/x86_64/minisign -S -W -s .minisign/minisign.key -t "$SIGNING_COMMENT" -m "${FILES[@]}"
        rm -f .minisign/minisign.key
        for f in "${FILES[@]}"; do
          mv -- "$f.minisig" "$f.sig"
        done
      env:
        RELEASE_FILES: ${{ steps.pack.outputs.release_files }}
        MINISIGN_KEY: ${{ inputs.minisign-key }}
        SIGNING_COMMENT: ${{ inputs.signing-comment }}
      shell: bash

    - uses: johnyherangi/create-release-notes@v1
      id: release-notes
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - run: |
        mkdir -p .github
        : > .github/RELEASE_NOTES.md
        if [ -f .github/RELEASE_NOTES_HEADER.md ]; then
          cat .github/RELEASE_NOTES_HEADER.md >> .github/RELEASE_NOTES.md
        fi
        printf "%s\n" "$RELEASE_NOTES" >> .github/RELEASE_NOTES.md
        if [ -f .github/RELEASE_NOTES_FOOTER.md ]; then
          cat .github/RELEASE_NOTES_FOOTER.md >> .github/RELEASE_NOTES.md
        fi
        cat .github/RELEASE_NOTES.md
      env:
        RELEASE_NOTES: ${{ steps.release-notes.outputs.release-notes }}
      shell: bash
    - uses: softprops/action-gh-release@v3
      with:
        draft: true
        body_path: .github/RELEASE_NOTES.md
        files: ${{ steps.pack.outputs.upload_files }}
        tag_name: ${{ inputs.tag }}
