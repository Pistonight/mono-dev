version: '3'

vars:
  MONO_DEV_MDBOOK_HOME1: { sh: echo $HOME }
  MONO_DEV_MDBOOK_HOME2: { sh: echo $USERPROFILE }
  MONO_DEV_MDBOOK_HOME3: { sh: echo $LOCALAPPDATA }
  MONO_DEV_MDBOOK_HOME4: '{{joinPath .TASKFILE_DIR ".." "mdbook" | absPath}}'
  MONO_DEV_MDBOOK_HOME: '{{coalesce .MONO_DEV_MDBOOK_HOME1 .MONO_DEV_MDBOOK_HOME2 .MONO_DEV_MDBOOK_HOME3 .MONO_DEV_MDBOOK_HOME4}}'
  MONO_DEV_MDBOOK_CACHE: '{{joinPath .MONO_DEV_MDBOOK_HOME ".cache" "mono-dev-mdbook"}}'
  MONO_DEV_MDBOOK_CACHE_LOCAL: '{{joinPath .TASK_DIR ".cache" "mono-dev-mdbook"}}'
  EXE_EXT: '{{if eq .OS "windows"}}.exe{{else}}{{end}}'

    

tasks:
  install-theme:
    # vars: 
    # - MDBOOK_TARGET: path to the book's package
    # - MONO_DEV: path to mono-dev root
    vars:
      MDBOOK_TARGET_RESOLVED: '{{.MDBOOK_TARGET| default "."}}'
      MONO_DEV: '{{.TASKFILE_DIR}}/..'
    cmds:
      - rm -rf {{.MDBOOK_TARGET_RESOLVED}}/theme
      - cp -r {{.MONO_DEV}}/mdbook/theme {{.MDBOOK_TARGET_RESOLVED}}


  test:
    cmds:
      - task: _mdbook

  _mdbook:
    vars:
      MDBOOK_: mdbook{{.EXE_EXT}}
      MDBOOK: '{{joinPath .MONO_DEV_MDBOOK_CACHE_LOCAL .MDBOOK_ | shellQuote}}'
    cmds:
      - task: _resolve-cache
        vars:
          DESC: mdbook@0.5
          PATH: '{{.MDBOOK_}}'
          BUILD: |
            if cmd_path=$(command -v mdbook); then
              mdbook_version=$(mdbook --version)
              case "$mdbook_version" in
                *"mdbook v0.5"*) echo "[mono-dev-mdbook]==> found $mdbook_version installed on the system"
                  cp "$cmd_path" $MONO_DEV_MDBOOK_ENV_BUILD_OUTPUT ;;
                *) echo "[mono-dev-mdbook]==> installing mdbook@0.5 with cargo"
                  cargo install mdbook@^0.5 --force --no-track --root $MONO_DEV_MDBOOK_ENV_BUILD_DIR
                  cp $MONO_DEV_MDBOOK_ENV_BUILD_DIR/bin/mdbook{{.EXE_EXT}} $MONO_DEV_MDBOOK_ENV_BUILD_OUTPUT
              esac
            else
              echo "[mono-dev-mdbook]==> installing mdbook@0.5 with cargo"
              cargo install mdbook@^0.5 --force --no-track --root $MONO_DEV_MDBOOK_ENV_BUILD_DIR
              cp $MONO_DEV_MDBOOK_ENV_BUILD_DIR/bin/mdbook{{.EXE_EXT}} $MONO_DEV_MDBOOK_ENV_BUILD_OUTPUT
            fi
      - '{{.MDBOOK}} --version'

  _resolve-cache:
    vars:
      LOCAL_CACHE_PATH: '{{joinPath .MONO_DEV_MDBOOK_CACHE_LOCAL .PATH}}'
      LOCAL_CACHE_PATH_QUOTE: '{{.LOCAL_CACHE_PATH | shellQuote}}'
      SYSTEM_CACHE_PATH: '{{joinPath .MONO_DEV_MDBOOK_CACHE .PATH}}'
      SYSTEM_CACHE_PATH_QUOTE: '{{.SYSTEM_CACHE_PATH | shellQuote}}'
    cmds:
      - silent: true
        cmd: |
          if [[ -e {{.LOCAL_CACHE_PATH_QUOTE}} ]]; then
            exit 0
          elif [[ -e {{.SYSTEM_CACHE_PATH | shellQuote}} ]]; then
            mkdir -p {{joinPath .LOCAL_CACHE_PATH ".." | absPath | shellQuote}}
            if [[ -f {{.SYSTEM_CACHE_PATH_QUOTE}} ]]; then
              cp {{.SYSTEM_CACHE_PATH_QUOTE}} {{.LOCAL_CACHE_PATH_QUOTE}}
            else
              cp -R {{.SYSTEM_CACHE_PATH_QUOTE}} {{.LOCAL_CACHE_PATH_QUOTE}}
            fi
          else
            MONO_DEV_MDBOOK_ENV_BUILD_DIR={{joinPath .SYSTEM_CACHE_PATH ".." | absPath | shellQuote}}
            mkdir -p $MONO_DEV_MDBOOK_ENV_BUILD_DIR
            MONO_DEV_MDBOOK_ENV_BUILD_OUTPUT={{.SYSTEM_CACHE_PATH_QUOTE}}
            echo
            echo '[mono-dev-mdbook]==> resolving {{.DESC}}'
            {{.BUILD}}
            mkdir -p {{joinPath .LOCAL_CACHE_PATH ".." | absPath | shellQuote}}
            if [[ -f {{.SYSTEM_CACHE_PATH_QUOTE}} ]]; then
              cp {{.SYSTEM_CACHE_PATH_QUOTE}} {{.LOCAL_CACHE_PATH_QUOTE}}
            else
              cp -R {{.SYSTEM_CACHE_PATH_QUOTE}} {{.LOCAL_CACHE_PATH_QUOTE}}
            fi
          fi
      
